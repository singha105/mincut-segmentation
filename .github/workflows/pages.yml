name: Deploy web page

# The site lives in web/ so its source is easy to find. GitHub Pages can only
# branch-deploy from the repo root or /docs, so it is published from Actions
# instead, which also lets the shared images in assets/ come along.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/assets
          cp -r assets/. _site/assets/
          echo "--- files to publish ---"
          find _site -type f | sort

      # index.html and the images it needs live in different folders, so a
      # rename can break the published page while everything still looks fine
      # in the repo. Fail the build instead of shipping a page with holes.
      - name: Check every local reference resolves
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          site = pathlib.Path("_site")
          html = (site / "index.html").read_text()

          refs = set()
          for ref in re.findall(r'(?:src|href)="([^"#:]+)"', html):
              # segmentation.js carries a ?v= cache-buster; the file on disk
              # has no query string, so strip it before looking.
              path = ref.split("?", 1)[0].lstrip("/")
              if path:
                  refs.add(path)

          missing = sorted(r for r in refs if not (site / r).exists())
          for ref in sorted(refs):
              print(("  ok      " if ref not in missing else "  MISSING ") + ref)
          if missing:
              print(f"\n{len(missing)} reference(s) missing from the built site")
              sys.exit(1)
          print(f"\nall {len(refs)} local references resolve")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
